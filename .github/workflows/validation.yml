name: validation

on:
  workflow_dispatch:
  pull_request:
  schedule:
    # 04:00 UTC on days 1–4. Europe/Berlin can still be on day 1–3 at that hour.
    # This workflow does not generate or publish lessons.
    - cron: "0 4 1-4 * *"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: python -m pip install -r backend/requirements.txt
      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q
      - name: Window check and dry run
        working-directory: backend
        run: |
          python -m app.automation.cli window-check
          python -m app.automation.cli dry-run
          python -m app.automation.cli validate
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend unit tests
        working-directory: apps/web
        run: |
          npm ci
          npm test
